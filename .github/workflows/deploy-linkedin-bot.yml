name: Deploy LinkedIn Bot

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-linkedin-bot.yml'
      - 'deploy/linkedin-bot/**'
      - 'fontes-estruturado/principal/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: curriculosis-linkedin-bot
  DEPLOY_HOST: 191.252.210.83
  DEPLOY_PATH: curriculosis/linkedin-bot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          echo "Disk before cleanup"
          df -h

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo apt-get clean
          docker system prune -af || true

          echo "Disk after cleanup"
          df -h

      - name: Prepare image metadata
        id: meta
        run: |
          IMAGE_REPO="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          IMAGE_TAG="${IMAGE_REPO}:${GITHUB_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/linkedin-bot/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_repo }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SSH authentication
        env:
          SSH_HOST: ${{ env.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "echo 'SSH authentication succeeded'"

      - name: Upload deploy assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          source: deploy/linkedin-bot/docker-compose.yml,deploy/linkedin-bot/start-linkedin-bot.sh
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 2

      - name: Deploy on host
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          LOOPBACK_URL: ${{ secrets.LOOPBACK_URL }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          timeout: 5m
          command_timeout: 120m
          envs: IMAGE_TAG,LOOPBACK_URL,DEPLOY_PATH,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            mkdir -p "$DEPLOY_PATH"
            chmod +x "$DEPLOY_PATH/start-linkedin-bot.sh" || true

            cat > "$DEPLOY_PATH/.env" <<ENVFILE
            LINKEDIN_BOT_IMAGE=$IMAGE_TAG
            LOOPBACK_URL=$LOOPBACK_URL
            LINKEDIN_HEADLESS=true
            LINKEDIN_CHROME_USER_DATA_DIR=/home/seluser/chrome-profile
            LINKEDIN_CHROME_PROFILE=Default
            LINKEDIN_CHECKPOINT_TIMEOUT_SECONDS=300
            ENVFILE

            mkdir -p "$DEPLOY_PATH/linkedin_chrome_profile"
            chmod 777 "$DEPLOY_PATH/linkedin_chrome_profile"

            cd "$DEPLOY_PATH"
            set -a
            . ./.env
            set +a

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            retry() {
              local attempt=1
              local max_attempts=3
              local wait_seconds=15
              until "$@"; do
                if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "Command failed after $max_attempts attempts: $*"
                  return 1
                fi
                echo "Attempt $attempt failed for: $*"
                attempt=$((attempt + 1))
                sleep "$wait_seconds"
              done
            }

            docker image prune -f || true

            retry docker compose --env-file .env -f docker-compose.yml pull -q linkedin-bot
            docker compose --env-file .env -f docker-compose.yml up -d --remove-orphans --pull never linkedin-bot
            docker image prune -f
