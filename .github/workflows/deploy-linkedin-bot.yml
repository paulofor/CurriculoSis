name: Deploy LinkedIn Bot

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-linkedin-bot.yml'
      - 'deploy/linkedin-bot/**'
      - 'fontes-estruturado/principal/**'
  workflow_dispatch:

env:
  DEPLOY_HOST: interface4g.vps-kinghost.net
  DEPLOY_PATH: /opt/curriculosis/linkedin-bot

jobs:
  build-and-publish-jar:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          echo "Disk before cleanup"
          df -h

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo apt-get clean
          docker system prune -af || true

          echo "Disk after cleanup"
          df -h

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build LinkedIn bot JAR
        run: |
          set -euo pipefail
          mvn -f fontes-estruturado/principal/pom.xml -pl obtemoportunidadelinkedin -am -DskipTests clean package

          mkdir -p dist/linkedin-bot
          cp fontes-estruturado/principal/obtemoportunidadelinkedin/target/linkedin-bot.jar dist/linkedin-bot/linkedin-bot.jar

      - name: Upload JAR for deploy
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-bot-jar
          path: dist/linkedin-bot/linkedin-bot.jar
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-publish-jar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: linkedin-bot-jar
          path: dist/linkedin-bot

      - name: Validate SSH authentication
        env:
          SSH_HOST: ${{ env.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "echo 'SSH authentication succeeded'"

      - name: Upload deploy assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          source: dist/linkedin-bot/linkedin-bot.jar
          target: ${{ env.DEPLOY_PATH }}

      - name: Deploy on host
        uses: appleboy/ssh-action@v1.0.3
        env:
          LOOPBACK_URL: ${{ secrets.LOOPBACK_URL }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          JAVA_OPTS: ${{ secrets.LINKEDIN_BOT_JAVA_OPTS }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          timeout: 5m
          command_timeout: 120m
          envs: LOOPBACK_URL,DEPLOY_PATH,JAVA_OPTS
          script: |
            set -e
            mkdir -p "$DEPLOY_PATH"

            cat > "$DEPLOY_PATH/.env" <<ENVFILE
            LOOPBACK_URL=$LOOPBACK_URL
            JAVA_OPTS="${JAVA_OPTS:--Xms256m -Xmx1024m}"
            ENVFILE

            cd "$DEPLOY_PATH"

            JAR_PATH=""
            for candidate in \
              "$DEPLOY_PATH/linkedin-bot.jar" \
              "$DEPLOY_PATH/dist/linkedin-bot/linkedin-bot.jar" \
              "$DEPLOY_PATH/linkedin-bot/linkedin-bot.jar"; do
              if [ -f "$candidate" ]; then
                JAR_PATH="$candidate"
                break
              fi
            done

            if [ -z "$JAR_PATH" ]; then
              echo "Arquivo linkedin-bot.jar não encontrado em $DEPLOY_PATH"
              echo "Arquivos de topo em $DEPLOY_PATH para diagnóstico rápido:"
              find "$DEPLOY_PATH" -maxdepth 2 -type f | sed "s|^| - |"
              exit 1
            fi

            if [ "$JAR_PATH" != "$DEPLOY_PATH/linkedin-bot.jar" ]; then
              cp "$JAR_PATH" "$DEPLOY_PATH/linkedin-bot.jar"
            fi

            echo "JAR implantado em $DEPLOY_PATH/linkedin-bot.jar. Execução automática desativada."
